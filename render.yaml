services:
  - type: web
    name: pulsevector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && PYTHONPATH=. python scripts/run_pipeline.py && PYTHONPATH=. python scripts/verify_artifacts.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
